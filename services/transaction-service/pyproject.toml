[project]
name = "kalash-transaction-service"
version = "0.1.0"
description = "Kalash Transaction Service foundations"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi==0.136.3",
  "httpx>=0.28,<0.29",
  "prometheus-fastapi-instrumentator>=7.1,<8",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.11,<3",
  "rich>=14,<15",
  "sqlalchemy[asyncio]>=2.0.43,<2.1",
  "tzdata>=2025.2",
  "uvicorn>=0.38,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7,<8",
  "respx>=0.22,<0.23",
  "ruff>=0.14,<1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
fail_under = 80
