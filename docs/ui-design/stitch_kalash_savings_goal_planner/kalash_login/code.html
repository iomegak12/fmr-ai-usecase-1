rem", "gutter-desktop": "2rem", "gutter": "1rem", "margin-desktop": "4rem" }, fontFamily: { "currency-display": ["Inter"], "body-lg": ["Inter"], "headline-lg": ["Epilogue"], "body-md": ["Inter"], "currency-md": ["Inter"], "headline-lg-mobile": ["Epilogue"], "label-md": ["Inter"], "display": ["Epilogue"], "body-sm": ["Inter"], "headline-sm": ["Epilogue"], "label-lg": ["Inter"], "display-mobile": ["Epilogue"], "headline-md": ["Epilogue"], "label-sm": ["Inter"] }, fontSize: { "currency-display": ["36px", { lineHeight: "44px", letterSpacing: "-0.02em", fontWeight: "700" }], "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }], "headline-lg": ["28px", { lineHeight: "36px", letterSpacing: "-0.01em", fontWeight: "600" }], "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }], "currency-md": ["20px", { lineHeight: "28px", fontWeight: "600" }], "headline-lg-mobile": ["24px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "600" }], "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "600" }], "display": ["40px", { lineHeight: "48px", letterSpacing: "-0.02em", fontWeight: "700" }], "body-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }], "headline-sm": ["18px", { lineHeight: "24px", fontWeight: "600" }], "label-lg": ["14px", { lineHeight: "20px", letterSpacing: "0.01em", fontWeight: "600" }], "display-mobile": ["32px", { lineHeight: "40px", letterSpacing: "-0.01em", fontWeight: "700" }], "headline-md": ["20px", { lineHeight: "28px", fontWeight: "600" }], "label-sm": ["10px", { lineHeight: "14px", letterSpacing: "0.04em", fontWeight: "600" }] } } } };</script><style>@layer base{html,body{width:100vw;min-height:100vh;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface font-body-lg text-body-lg text-on-surface flex flex-col min-h-screen"><main class="flex flex-col flex-1 w-full bg-surface pt-safe pb-safe"><div class="flex flex-col w-full px-margin py-space-lg items-center justify-center">
<div class="w-full max-w-md flex flex-col items-center">
<!-- Sacred Kalash Card Container -->
<div class="w-full bg-surface-container-lowest rounded-xl p-space-lg shadow-xl relative overflow-hidden flex flex-col">
<!-- Decorative Organic Glow Accent -->
<div class="absolute -top-12 -right-12 w-36 h-36 rounded-full bg-primary-fixed/30 blur-2xl pointer-events-none"></div>
<div class="absolute -bottom-10 -left-10 w-28 h-28 rounded-full bg-secondary-fixed/40 blur-xl pointer-events-none"></div>
<!-- Header: Logo & Branding Metaphor -->
<div class="flex flex-col items-center text-center relative z-10 mb-space-md">
<div class="w-20 h-20 mb-space-xs flex items-center justify-center relative">
<!-- Kalash Sacred Emblem Placeholder -->
<img alt="Kalash Sacred Pot Emblem" class="w-16 h-16 object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1XsxY94LXVuBx5noVUn7M44WlKvY0nbESoAvg2yTMA894tzM4UVwEfkoGlCmE9E-cpePWYFisNw70c5XSVLyfPt86L-PVNyQCVFlxBwrezVzzW81O3TC3WIdkHilGXrkB7vyHctIhUsyopzee7Xlzu6CNkQ9nNKzuDEp0ZuyjVYc86ajsZh-e7BwAchfOm9doRhk0kjnhLlgTjyYVTmmG0J_8izPnHfeS5p0GLwLe3_CEiTFoLqsaBc1Ag"/>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-secondary-fixed tracking-tight mt-1">
          Kalash
        </h1>
<p class="font-label-md text-label-md text-primary font-semibold tracking-wide uppercase mt-1">
          Fill your Kalash, one goal at a time.
        </p>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2 max-w-xs leading-relaxed">
          Welcome back! Enter your details to continue your savings ritual.
        </p>
</div>
<!-- Authentication Form -->
<form class="flex flex-col gap-space-sm relative z-10 w-full mt-2" id="kalashLoginForm" onsubmit="event.preventDefault(); triggerDemoError();">
<!-- Username Field -->
<div class="flex flex-col gap-1.5 text-left">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1.5" for="usernameInput">
<span class="material-symbols-outlined text-[16px] text-primary">person</span>
            Username
          </label>
<div class="relative flex items-center">
<input autocomplete="username" class="w-full bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md rounded-lg py-3.5 px-4 outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#b25f18]" id="usernameInput" placeholder="e.g. aarav.sharma" type="text" value="aarav.sharma"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5 text-left mt-1">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1.5" for="passwordInput">
<span class="material-symbols-outlined text-[16px] text-primary">lock</span>
            Password
          </label>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md rounded-lg py-3.5 pl-4 pr-12 outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#b25f18]" id="passwordInput" placeholder="••••••••" type="password" value="secret123"/>
<button aria-label="Toggle password visibility" class="absolute right-3 p-1.5 text-outline hover:text-on-surface flex items-center justify-center transition-colors" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="passwordEyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Primary Action Button -->
<button class="w-full mt-3 bg-primary text-on-primary font-label-lg text-label-lg py-3.5 px-6 rounded-lg transition-transform active:scale-[0.99] flex items-center justify-center gap-2 shadow-md hover:bg-primary-container" id="loginSubmitBtn" type="submit">
<span>Log in</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<!-- Inline Error Banner -->
<div class="flex items-center gap-2.5 p-3 rounded-lg bg-error-container text-on-error-container mt-2 shadow-sm transition-all duration-300" id="errorMessageBlock" role="alert">
<span class="material-symbols-outlined text-error text-[20px] flex-shrink-0" style="font-variation-settings: 'FILL' 1;">
            error
          </span>
<span class="font-label-md text-label-md text-error leading-tight">
            Incorrect username or password.
          </span>
</div>
</form>
<!-- Minimal Demo Access Indicator -->
<div class="mt-space-md pt-space-xs flex flex-col items-center justify-center text-center relative z-10">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container text-outline">
<span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
<span class="font-label-sm text-label-sm tracking-wide uppercase">Demo access only</span>
</div>
</div>
</div>
<!-- Sacred Micro-milestone Whisper -->
<div class="mt-space-md text-center flex items-center justify-center gap-2 text-outline">
<span class="material-symbols-outlined text-[16px] text-tertiary">spa</span>
<p class="font-body-sm text-body-sm text-on-surface-variant">
        Protected financial vessel with 256-bit encryption
      </p>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('passwordInput');
    const eyeIcon = document.getElementById('passwordEyeIcon');
    if (!passwordInput || !eyeIcon) return;
    
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }

  function triggerDemoError() {
    const errBox = document.getElementById('errorMessageBlock');
    if (!errBox) return;
    
    // Quick micro-shake feedback
    errBox.classList.remove('translate-x-1', '-translate-x-1');
    errBox.classList.add('translate-x-1');
    setTimeout(() => {
      errBox.classList.remove('translate-x-1');
      errBox.classList.add('-translate-x-1');
    }, 80);
    setTimeout(() => {
      errBox.classList.remove('-translate-x-1');
    }, 160);
  }
</script></main></body></html>
