# Transaction Service pipeline (plan Section 5.9): uv, Ruff check and format
# check, unit tests with the pytest-cov 80% gate, coverage report, image build
# and push.
#
# Pull requests always start this workflow so its checks can be required.
# The changes job skips the work, reported as passed, when a pull request does
# not touch this project. Tag pushes ignore path filters, so a vX.Y.Z tag
# builds every project.

name: transaction-service

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - services/transaction-service/**
      - scripts/**
      - .github/workflows/transaction-service.yml
      - .github/workflows/image.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: transaction-service changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Did this project change?
        id: diff
        run: |
          set -euo pipefail
          changed=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] &&
            ! git diff --name-only HEAD^1 HEAD |
              grep -qE '^(services/transaction-service/|scripts/|\.github/workflows/(transaction-service|image)\.yml$)'; then
            changed=false
            echo "::notice::No Transaction Service changes in this pull request; checks skipped."
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  verify:
    name: transaction-service verify
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.9.16"
          enable-cache: true
          cache-dependency-glob: services/transaction-service/uv.lock

      - name: No raw SQL in application code (D-08)
        run: |
          if grep -rnE '\btext\(|exec_driver_sql|\.execute\(\s*f?["'\'']|raw_connection|\.cursor\(' \
            services/transaction-service/app; then
            echo "::error::Use the SQLAlchemy ORM (select, session.add, session.delete); SQL belongs only in Alembic op calls."
            exit 1
          fi

      - name: Install locked dependencies
        working-directory: services/transaction-service
        run: uv sync --locked

      - name: Ruff check and format check
        run: make -C services/transaction-service lint

      - name: Unit tests and the pytest-cov gate
        run: make -C services/transaction-service coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transaction-service-coverage
          path: |
            services/transaction-service/coverage.xml
            services/transaction-service/htmlcov/
          if-no-files-found: warn
          retention-days: 14

      - name: Project version
        id: version
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("services/transaction-service/pyproject.toml", "rb") as handle:
              print("version=" + tomllib.load(handle)["project"]["version"])
          EOF

  image:
    name: transaction-service image
    needs: verify
    uses: ./.github/workflows/image.yml
    with:
      image: transaction-service
      context: services/transaction-service
      version-arg: VERSION
      project-version: ${{ needs.verify.outputs.version }}
    secrets: inherit
