# Shared upstream settings, included in every proxied location (LLD §18).

proxy_http_version 1.1;
proxy_set_header Connection "";

# Forwarded headers describe this gateway's view of the request. Values a
# client sent are replaced, and an empty value removes the header, so
# clients cannot spoof the prefix, port or RFC 7239 Forwarded header that
# Spring's forwarded-header support would otherwise trust.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Prefix $docs_prefix;
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Forwarded-Ssl "";
proxy_set_header Forwarded "";

proxy_set_header X-Correlation-ID $correlation_id;

proxy_connect_timeout 2s;
proxy_send_timeout 10s;
proxy_read_timeout 10s;
