# Health and readiness (D-16, plan Section 7.2). Never rate limited.

# Gateway liveness: nginx is answering.
location = /health {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 200 '{"status":"UP"}';
}

# Gateway readiness: UP when Redis answers, DEGRADED (still HTTP 200) when
# it does not, because the limiter fails open.
location = /ready {
    content_by_lua_block {
        require("kalash.gateway").ready()
    }
}

# Pass-through checks for each service.
location = /health/goals {
    include snippets/proxy.conf;
    proxy_pass http://goal_service/health;
}

location = /ready/goals {
    include snippets/proxy.conf;
    proxy_pass http://goal_service/ready;
}

location = /health/transactions {
    include snippets/proxy.conf;
    proxy_pass http://transaction_service/health;
}

location = /ready/transactions {
    include snippets/proxy.conf;
    proxy_pass http://transaction_service/ready;
}
