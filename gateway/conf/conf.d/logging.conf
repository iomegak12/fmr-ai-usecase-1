# Correlation ID and JSON access log (LLD §18, §25; plan Section 7.6).

# Reuse a client's X-Correlation-ID only when the services would accept it
# (1-128 letters, digits, '.', '_' or '-'); otherwise use nginx's 32-character
# request ID, so the gateway and the services log the same value.
map $http_x_correlation_id $correlation_id {
    "~^[A-Za-z0-9._-]{1,128}$" $http_x_correlation_id;
    default                    $request_id;
}

# Requests that never reach the limiter (health, docs, landing page) leave
# $ratelimit_outcome empty.
map $ratelimit_outcome $ratelimit_log {
    ""      "skipped";
    default $ratelimit_outcome;
}

map $status $access_log_level {
    "~^5"   "ERROR";
    "~^4"   "WARN";
    default "INFO";
}

log_format kalash_json escape=json
    '{"timestamp":"$time_iso8601",'
    '"level":"$access_log_level",'
    '"service":"gateway",'
    '"message":"request completed",'
    '"correlationId":"$correlation_id",'
    '"clientIp":"$remote_addr",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"durationSeconds":$request_time,'
    '"upstream":"$upstream_addr",'
    '"upstreamStatus":"$upstream_status",'
    '"upstreamConnectSeconds":"$upstream_connect_time",'
    '"rateLimit":"$ratelimit_log",'
    '"rateLimitRemaining":"$ratelimit_remaining",'
    '"bytesSent":$body_bytes_sent,'
    '"userAgent":"$http_user_agent"}';

access_log /dev/stdout kalash_json;
