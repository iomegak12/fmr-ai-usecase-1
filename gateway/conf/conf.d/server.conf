# The single public origin (LLD §18; D-19: no CORS headers anywhere).

server {
    listen 80 default_server;
    server_name _;
    root html;

    # Relative Location headers keep redirects correct whatever host port
    # the gateway is published on.
    absolute_redirect off;

    # Declared here so Lua can assign them. They stay empty unless the
    # limiter ran; $docs_prefix is set only on documentation routes.
    set $ratelimit_outcome "";
    set $ratelimit_limit "";
    set $ratelimit_remaining "";
    set $ratelimit_reset "";
    set $docs_prefix "";

    # headers-more replaces any upstream copy, and adds nothing for an empty
    # value, so X-RateLimit-* appear only on requests the limiter counted.
    # These apply to every response, including 429 and upstream errors.
    more_set_headers "X-Correlation-ID: $correlation_id";
    more_set_headers "X-RateLimit-Limit: $ratelimit_limit";
    more_set_headers "X-RateLimit-Remaining: $ratelimit_remaining";
    more_set_headers "X-RateLimit-Reset: $ratelimit_reset";

    # Upstream connection failures and timeouts generated by nginx itself
    # become Problem Details. Upstream 4xx/5xx responses (for example
    # TXN-002 or TXN-003) pass through unchanged.
    error_page 502 503 = @upstream_unavailable;
    error_page 504 = @upstream_timeout;

    location @upstream_unavailable {
        content_by_lua_block {
            require("kalash.gateway").upstream_error(502)
        }
    }

    location @upstream_timeout {
        content_by_lua_block {
            require("kalash.gateway").upstream_error(504)
        }
    }

    include conf.d/health.conf;
    include conf.d/docs.conf;
    include conf.d/routes.conf;
}
