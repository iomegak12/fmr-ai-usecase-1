# Client IP for logging and rate limiting (D-15).
#
# $remote_addr is the TCP peer unless that peer is a trusted proxy listed in
# TRUSTED_PROXIES. Only then is the client address taken from
# X-Forwarded-For (right to left, skipping trusted hops). TRUSTED_PROXIES is
# empty by default, so forwarded headers from clients are ignored.
real_ip_header X-Forwarded-For;
real_ip_recursive on;
include generated/trusted_proxies.conf;
