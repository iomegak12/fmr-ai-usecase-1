# Lua runtime for the rate limiter (D-09 to D-12).

lua_package_path "$prefix/lua/?.lua;;";

# Gateway start time shared by all workers (kalash.warmup).
lua_shared_dict kalash_gateway 1m;

# Redis failures are logged once by kalash.ratelimit with
# event=ratelimit_store_unavailable; skip nginx's duplicate socket errors.
lua_socket_log_errors off;

init_by_lua_block {
    require("kalash.gateway").init()
}

init_worker_by_lua_block {
    require("kalash.gateway").init_worker()
}

exit_worker_by_lua_block {
    require("kalash.gateway").exit_worker()
}
