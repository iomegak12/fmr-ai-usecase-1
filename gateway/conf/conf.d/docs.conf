# API documentation through the gateway (D-18, plan Section 7.3).
# Not rate limited. Only the documentation paths themselves are forwarded,
# so these routes cannot reach API or internal endpoints.

# Goal Service: springdoc builds gateway-prefixed URLs from
# X-Forwarded-Prefix (services/goal-service/README.md, "Gateway contract").
location = /docs/goals {
    return 301 /docs/goals/;
}

location = /docs/goals/ {
    return 302 /docs/goals/swagger-ui;
}

location ~ ^/docs/goals/(?:swagger-ui(?:/.*)?|v3/api-docs(?:/.*)?)$ {
    set $docs_prefix /docs/goals;
    rewrite ^/docs/goals(/.*)$ $1 break;
    include snippets/proxy.conf;
    proxy_pass http://goal_service;
}

# Transaction Service: FastAPI builds the schema URL from its root path, so
# the service runs with APP_ROOT_PATH=/docs/transactions behind the gateway
# (services/transaction-service/README.md).
location = /docs/transactions {
    return 301 /docs/transactions/;
}

location = /docs/transactions/ {
    return 302 /docs/transactions/docs;
}

location ~ ^/docs/transactions/(?:docs|docs/oauth2-redirect|openapi\.json)$ {
    rewrite ^/docs/transactions(/.*)$ $1 break;
    include snippets/proxy.conf;
    proxy_pass http://transaction_service;
}
