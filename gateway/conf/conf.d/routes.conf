# Public API routes, internal-route blocking and the landing page
# (LLD §18; D-13, D-29). Only /api/v1/* is rate limited.

# Landing page (D-29).
location = / {
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
}

location ~ ^/api/v1/goals(?:/|$) {
    access_by_lua_block {
        require("kalash.gateway").rate_limit()
    }
    include snippets/proxy.conf;
    proxy_pass http://goal_service;
}

location ~ ^/api/v1/transactions(?:/|$) {
    access_by_lua_block {
        require("kalash.gateway").rate_limit()
    }
    include snippets/proxy.conf;
    proxy_pass http://transaction_service;
}

# Unknown /api/v1/* paths are still counted, then answered with 404.
location /api/v1/ {
    access_by_lua_block {
        require("kalash.gateway").rate_limit()
    }
    content_by_lua_block {
        require("kalash.gateway").not_found()
    }
}

# Service-to-service APIs are never exposed (LLD §12, §19). ^~ stops any
# regular-expression location from matching these paths.
location ^~ /internal/ {
    content_by_lua_block {
        require("kalash.gateway").not_found()
    }
}

# Everything else, including metrics endpoints (LLD §26), is not routed.
location / {
    content_by_lua_block {
        require("kalash.gateway").not_found()
    }
}
