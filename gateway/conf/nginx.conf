# Kalash API Gateway (OpenResty). Implements LLD §18 and plan Section 5.5.
#
# Files under generated/ are written at container start by
# docker-entrypoint.sh from environment variables (upstreams, resolver and
# trusted proxies). Everything else is static.

worker_processes auto;
error_log stderr notice;

# Variables read by the Lua limiter (kalash.config). nginx clears the
# environment of worker processes unless a variable is listed here.
env REDIS_HOST;
env REDIS_PORT;
env REDIS_TIMEOUT_MS;
env RATE_LIMIT_REQUESTS;
env RATE_LIMIT_WINDOW_SECONDS;
env RATE_LIMIT_WARMUP_SECONDS;

# Bound the SIGQUIT graceful stop (plan Section 7.5).
worker_shutdown_timeout 5s;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    client_body_temp_path /var/run/openresty/nginx-client-body;
    proxy_temp_path       /var/run/openresty/nginx-proxy;
    fastcgi_temp_path     /var/run/openresty/nginx-fastcgi;
    uwsgi_temp_path       /var/run/openresty/nginx-uwsgi;
    scgi_temp_path        /var/run/openresty/nginx-scgi;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    include conf.d/logging.conf;
    include conf.d/real_ip.conf;
    include generated/resolver.conf;
    include generated/upstreams.conf;
    include conf.d/lua.conf;
    include conf.d/server.conf;
}
